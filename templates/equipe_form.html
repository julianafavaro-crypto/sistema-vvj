{% extends "base.html" %}
{% block title %}{{ titulo }} — Sistema VVJ{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ titulo }}</h1>
  <a href="{{ url_for('equipe') }}" class="btn btn-ghost">← Voltar</a>
</div>

<div class="panel form-panel">
  <form method="post">
    <div class="form-grid">
      <div class="form-group full">
        <label>Nome completo *</label>
        <input type="text" name="nome" value="{{ membro.nome if membro else '' }}" required class="input">
      </div>
      {% if not membro %}
      <div class="form-group">
        <label>Login (único) *</label>
        <input type="text" name="login" class="input" placeholder="ex: paulo" required>
      </div>
      <div class="form-group">
        <label>Senha inicial</label>
        <input type="text" name="senha" class="input" value="vvj2026" placeholder="vvj2026">
      </div>
      {% endif %}
      <div class="form-group">
        <label>Perfil de acesso</label>
        <select name="perfil" class="input">
          <option value="tecnico" {% if not membro or membro.perfil=='tecnico' %}selected{% endif %}>Técnico — acesso limitado</option>
          <option value="proprietario" {% if membro and membro.perfil=='proprietario' %}selected{% endif %}>Proprietário — acesso total</option>
        </select>
      </div>
      <div class="form-group">
        <label>Cargo / Especialidade</label>
        <input type="text" name="cargo" value="{{ membro.cargo if membro else '' }}" class="input" placeholder="ex: Georreferenciamento">
      </div>
      {% if membro %}
      <div class="form-group">
        <label>Situação</label>
        <select name="ativo" class="input">
          <option value="1" {% if membro.ativo %}selected{% endif %}>Ativo</option>
          <option value="0" {% if not membro.ativo %}selected{% endif %}>Inativo</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nova senha <span style="font-size:.75rem;color:#aaa">(deixe vazio para não alterar)</span></label>
        <input type="password" name="nova_senha" class="input" minlength="4" placeholder="••••••••">
      </div>
      {% endif %}
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">💾 Salvar</button>
      <a href="{{ url_for('equipe') }}" class="btn btn-ghost">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
