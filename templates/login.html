<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema VVJ — Acesso</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  body { background: #0f2318; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  .login-wrap { width: 100%; max-width: 400px; padding: 1rem; }
  .login-logo { text-align: center; margin-bottom: 2rem; }
  .login-monogram { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; background: #2d6a4f; border-radius: 14px; font-size: 1.3rem; font-weight: 900; color: #fff; letter-spacing: 1px; margin-bottom: 1rem; }
  .login-titulo { color: #fff; font-size: 1.25rem; font-weight: 700; }
  .login-sub { color: rgba(255,255,255,.45); font-size: .82rem; margin-top: .25rem; }
  .login-card { background: #fff; border-radius: 14px; padding: 2rem; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
  .login-card h2 { font-size: 1.1rem; color: #1a1a1a; margin-bottom: 1.25rem; font-weight: 700; }
  .login-group { margin-bottom: 1rem; }
  .login-group label { display: block; font-size: .8rem; font-weight: 600; color: #555; margin-bottom: .35rem; }
  .login-group input { width: 100%; padding: .65rem .85rem; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: .95rem; transition: border-color .15s; }
  .login-group input:focus { outline: none; border-color: #2d6a4f; box-shadow: 0 0 0 3px rgba(45,106,79,.12); }
  .btn-login { width: 100%; padding: .75rem; background: #0f2318; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: .5rem; transition: background .15s; }
  .btn-login:hover { background: #1a3a27; }
  .login-erro { background: #fee2e2; color: #991b1b; padding: .65rem .85rem; border-radius: 8px; font-size: .875rem; margin-bottom: 1rem; font-weight: 600; }
  .login-footer { text-align: center; margin-top: 1.5rem; color: rgba(255,255,255,.3); font-size: .75rem; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="login-monogram">VVJ</div>
    <div class="login-titulo">Plataforma Integrada</div>
    <div class="login-sub">VKS · VALSS · JF Florestal</div>
  </div>

  <div class="login-card">
    <h2>Entrar no sistema</h2>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="login-erro">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <div class="login-group">
        <label>Login</label>
        <input type="text" name="login" placeholder="seu login" autocomplete="username" autofocus required>
      </div>
      <div class="login-group">
        <label>Senha</label>
        <input type="password" name="senha" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login">Entrar →</button>
    </form>
  </div>

  <div class="login-footer">Sistema VVJ &copy; 2026 · VKS · VALSS · JF Florestal</div>
</div>
</body>
</html>
